name: Island Post playtest
on:
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/audio/**'
      - 'src/world/**'
      - 'scripts/tests/island-post.*'
      - '.github/workflows/island-post.yml'
permissions:
  contents: read
jobs:
  deliveries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install playwright==1.56.0
      - name: Build the test entry with the production game
        run: >
          node --input-type=module -e "import {build} from 'vite';
          await build({build:{outDir:'.island-post-test',rollupOptions:{input:'scripts/tests/island-post.html'}}});"
      - name: Play eight dispatches in Chrome
        run: |
          python -m http.server 4191 --bind 127.0.0.1 --directory .island-post-test > "$RUNNER_TEMP/post-server.log" 2>&1 &
          python scripts/tests/island-post.py http://127.0.0.1:4191/scripts/tests/island-post.html "$RUNNER_TEMP/postcards"
      - name: Save the album and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-post-playtest
          path: ${{ runner.temp }}/postcards/
          if-no-files-found: ignore
