name: Verify repaired main merges
on:
  push:
    branches: [codex/recent-main-ci-validation]
permissions:
  contents: read
jobs:
  verify:
    name: Full CI for ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr-255
            original: "9291b0a3dacf5774fe16b3d71bf355ef4deb33a0"
            snapshot: "18ca35ac5704149a72eba53b279bd71b3ef52817"
          - label: pr-272
            original: "b7e1893698df7423bdcdf37222d10911386d14bd"
            snapshot: "a90cfcbe3408f8f8e0883660ff0e0f3337d9eb50"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.snapshot }}
          persist-credentials: false
      - name: Verify the commit under test
        env:
          ORIGINAL: ${{ matrix.original }}
          SNAPSHOT: ${{ matrix.snapshot }}
        run: |
          test "$(git rev-parse HEAD)" = "$SNAPSHOT"
          printf 'Original main commit: %s\n' "$ORIGINAL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Repair commit under test: %s\n' "$SNAPSHOT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit)
        run: npm test
      - name: Test (headless Chrome, serial)
        env:
          BROWSER_SMOKE: '1'
        run: npm run test:chrome
      - name: Build
        run: npm run build
