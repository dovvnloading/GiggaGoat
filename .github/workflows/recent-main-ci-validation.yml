name: Verify repaired main merges
on:
  push:
    branches: [codex/recent-main-ci-validation]
permissions:
  contents: read
jobs:
  verify:
    name: Full CI for ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr-275
            original: "5fdde8b5431cf41bbb7649b5e85903d820be5e6"
            snapshot: "c8e178ad1f9999e3fd1582f2a6d88caff1122284"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.snapshot }}
          persist-credentials: false
      - name: Verify the commit under test
        env:
          ORIGINAL: ${{ matrix.original }}
          SNAPSHOT: ${{ matrix.snapshot }}
        run: |
          test "$(git rev-parse HEAD)" = "$SNAPSHOT"
          printf 'Original main commit: %s\n' "$ORIGINAL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Repair commit under test: %s\n' "$SNAPSHOT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit)
        run: npm test
      - name: Test (headless Chrome, serial)
        env:
          BROWSER_SMOKE: '1'
        run: npm run test:chrome
      - name: Build
        run: npm run build
