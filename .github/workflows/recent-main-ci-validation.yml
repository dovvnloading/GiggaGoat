name: Verify repaired main merges
on:
  push:
    branches: [codex/recent-main-ci-validation]
permissions:
  contents: read
jobs:
  verify:
    name: Full CI for ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr-245
            original: "3ec8ddefa9023ba4083c7a1972c78bf7a493bf57"
            snapshot: "8cbcbdd6f993faa7b5fc61d393e1a784e1ca9d13"
          - label: pr-249
            original: "6aa3b5ce420dfe052068055aaa388bda3222d1cf"
            snapshot: "5e94b759ec2d62323a05ff6d3722bc1977820e6e"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.snapshot }}
          persist-credentials: false
      - name: Verify the commit under test
        env:
          ORIGINAL: ${{ matrix.original }}
          SNAPSHOT: ${{ matrix.snapshot }}
        run: |
          test "$(git rev-parse HEAD)" = "$SNAPSHOT"
          printf 'Original main commit: %s\n' "$ORIGINAL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Repair commit under test: %s\n' "$SNAPSHOT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit)
        run: npm test
      - name: Test (headless Chrome, serial)
        env:
          BROWSER_SMOKE: '1'
        run: npm run test:chrome
      - name: Build
        run: npm run build
