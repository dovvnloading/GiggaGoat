name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # The World Lab profiler and HUD geometry tests also launch Chrome.
      # Run production smoke in its own step to avoid Chromium startup contention.
      - name: Production browser smoke
        run: BROWSER_SMOKE=1 npm test -- src/core/browser-smoke.test.ts
      - name: Build
        run: npm run build
