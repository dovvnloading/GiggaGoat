name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit)
        run: npm test
      - name: Test (headless Chrome, serial)
        env:
          BROWSER_SMOKE: '1'
          WORLD_DETAIL_PREVIEWS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: npm run test:chrome
      - name: Upload world art review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: world-detail-previews
          path: .world-detail-previews/*.jpg
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Build
        run: npm run build
      - name: Upload tested Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this build is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because main has advanced to $main_sha."
          fi
      - id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
