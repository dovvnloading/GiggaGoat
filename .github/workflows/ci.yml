name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit)
        run: npm test
      - name: Test (headless Chrome, serial)
        env:
          BROWSER_SMOKE: '1'
          WORLD_DETAIL_PREVIEWS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: npm run test:chrome
      - name: Upload world art review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: world-detail-previews
          path: .world-detail-previews/*.jpg
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Build
        run: npm run build
      - name: Upload tested Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  living-world-evidence:
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 330 || contains(github.event.pull_request.labels.*.name, 'living-world-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Check out the recorded pre-implementation baseline
        uses: actions/checkout@v4
        with:
          ref: 92001c7ec3f851be8468590b237833e0d0e007f8
          path: .living-world-baseline
      - name: Capture recorded baseline
        run: |
          ln -s ../node_modules .living-world-baseline/node_modules
          npm run capture:living-world -- --root .living-world-baseline --out .living-world-captures/before --label before --samples 24
      - name: Capture implemented game and continuous walkthrough
        if: always()
        run: npm run capture:living-world -- --out .living-world-captures/after --label after --samples 24 --tour 100
      - name: Upload gameplay, raw profiles and matching views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-world-evidence
          path: .living-world-captures/
          include-hidden-files: true
          if-no-files-found: warn

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this build is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because main has advanced to $main_sha."
          fi
      - id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
